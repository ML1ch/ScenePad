name: Build ScenePad APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Extract app source
        run: unzip -q ScenePad-Android-MVP-api37.zip
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 37 preview
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" --channel=3 "platforms;android-37"
          BUILD_TOOLS_PACKAGE=$("$SDKMANAGER" --channel=3 --list | awk -F '|' '/build-tools;37\./ {gsub(/^[ \t]+|[ \t]+$/, "", $1); print $1}' | tail -n 1)
          test -n "$BUILD_TOOLS_PACKAGE"
          "$SDKMANAGER" --channel=3 "$BUILD_TOOLS_PACKAGE"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Build debug APK
        working-directory: ScenePad
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: scenepad-debug-apk
          path: ScenePad/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
